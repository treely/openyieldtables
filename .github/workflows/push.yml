name: Push an Image to ECR and ACR

on:
  push:
    branches:
      - main

jobs:
  push:
    name: Push
    runs-on: ubuntu-latest
    environment: ecr-push
    env:
      IMAGE: treely/yield-tables
      ACR_REGISTRY: treelyyieldtablesstaging.azurecr.io
      CONTAINER_APP_NAME: yield-tables
      CONTAINER_APP_RESOURCE_GROUP: yield-tables-staging
    steps:
      # Generate build ID
      - name: Get branch name (merge)
        if: github.event_name != 'pull_request'
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g; s/-/_/g')" >> $GITHUB_ENV
      - name: Get branch name (pull request)
        if: github.event_name == 'pull_request'
        run: echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF} | sed 's/\//_/g; s/-/_/g')" >> $GITHUB_ENV
      - name: Generate build ID
        id: prep
        run: echo "build_id=${BRANCH_NAME}-${GITHUB_SHA::8}-$(date +%s)" >> $GITHUB_OUTPUT
      # Check-out repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      # Install poetry
      - name: Install poetry
        run: pipx install poetry==1.8.2
      # Set-up python with cache
      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "poetry"
      # Install requirements
      - name: Install requirements
        run: poetry install
      # Run linters
      - name: Run linters
        run: |
          set -o pipefail
          poetry run pre-commit run --all-files
      # Run unit tests
      - name: Run tests
        run: |
          set -o pipefail
          poetry run pytest -- --cov-report xml

      # --- ECR ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build and tag image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BUILD_ID: ${{ steps.prep.outputs.build_id }}
        run: |
          docker build \
            -t ${IMAGE}:${BUILD_ID} \
            -t ${ECR_REGISTRY}/${IMAGE}:${BUILD_ID} \
            -t ${ACR_REGISTRY}/${IMAGE}:${BUILD_ID} ./
      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BUILD_ID: ${{ steps.prep.outputs.build_id }}
        run: docker push ${ECR_REGISTRY}/${IMAGE}:${BUILD_ID}

      # --- ACR ---
      - name: Login to Azure
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        env:
          BUILD_ID: ${{ steps.prep.outputs.build_id }}
        run: |
          az acr login --name treelyyieldtablesstaging
          docker push ${ACR_REGISTRY}/${IMAGE}:${BUILD_ID}
      - name: Deploy to Azure Container App (staging)
        env:
          BUILD_ID: ${{ steps.prep.outputs.build_id }}
        run: |
          az containerapp update \
            --name ${CONTAINER_APP_NAME} \
            --resource-group ${CONTAINER_APP_RESOURCE_GROUP} \
            --image ${ACR_REGISTRY}/${IMAGE}:${BUILD_ID}
